<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Giratoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rueda Giratoria</h1>

    <div class="wheel-container">
        <!-- Flecha derecha centrada -->
        <div class="arrow"></div>

        <canvas id="wheel" width="500" height="500"></canvas>
        <button id="spin">Girar</button>
    </div>

    <div class="inputs">
        <h3>Opciones:</h3>
        <textarea id="options" rows="6">
        </textarea>
        <button id="update">Actualizar rueda</button>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/noumanqamar450/alertbox@main/version/1.0.2/alertbox.min.js"></script>
</body>
</html>
